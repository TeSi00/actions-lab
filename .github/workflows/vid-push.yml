name: Vid push
on:
 push:
   branches: [ main ]
 
jobs:
  titta:
    runs-on: ubuntu-latest
    steps:
      - name: Vilka filer finns här?
        run: ls -la
      - name: Hämtakoden
        uses: actions/checkout@v4
      - name: Vilka filer finns nu?
        run: ls -la
      - name: Vem gjorde detta?
        run: echo "${{ github.actor }} pushade till ${{ github.repository }}"
